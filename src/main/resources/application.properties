spring.application.name=inventario-gastronomico

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS
# ============================================
# Para usar H2 (memoria) - perfil por defecto
# Para usar MySQL con WampServer - usar: --spring.profiles.active=mysql
# ============================================

# Configuración de base de datos H2 (por defecto)
spring.datasource.url=jdbc:h2:mem:inventariodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accesible en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de recursos estáticos
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.static-locations=classpath:/static/

# Configuración del servidor
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
